<!DOCTYPE html>
<html>
	<head>
		<meta name="HandheldFriendly" content="true" />
		<meta name="MobileOptimized" content="320" />
		<meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, width=device-width, user-scalable=no" />
		<style>
			* {
				font-size: min(6vw, 6vh);
				font-family: sans-serif;
				color: #00241B;
			}
			
			::selection {
				background-color: #00241B;
				color: #B5FFE1;
			}
			
			html {
				width: 100%;
				height: 100%;
			}
			
			body {
				transition-duration: 0.2s;
				background-color: #B5FFE1;
				margin: 0;
				width: 100%;
				height: 98%;
				text-align: center;
			}
			
			button {
				transition-duration: 0.2s;
				background-color: #93E5AB;
				border: 0.1rem solid #65B891;
				border-radius: 0.2rem;
				color: #00241B;
				box-shadow: #65B891 0 0.15rem;
				cursor: pointer;
			}
			
			button:hover {
				transform: translateY(0.15rem);
				background-color: #65B891;
				color: #B5FFE1;
				box-shadow: #65B891 0 0;
			}
			
			.header {
				font-size: 2rem;
				font-weight: bold;
			}
		</style>
		<title>KG25 Messages!</title>
	</head>
	<body>
		<span class="header">Uh Oh! Nothing!</span><br>
		<span>It seems that we cannot find what you were looking for...</span><br><br>
		<button onclick="history.back()">Go back?</button><br>
	</body>
</html>
